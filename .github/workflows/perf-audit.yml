name: perf-audit

on:
  schedule:
    # 03:00 UTC on the 1st of every other month (Jan/Mar/May/Jul/Sep/Nov)
    - cron: '0 3 1 1/2 *'
  workflow_dispatch: # manual trigger for verification

permissions:
  contents: read
  issues: write    # needed to open / comment on the perf-regression issue

# Never cancel an in-flight audit; serialized runs only.
concurrency:
  group: perf-audit
  cancel-in-progress: false

jobs:
  perf-07:
    # Hard cap so a runaway job doesn't burn the whole Actions quota.
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # The verify script signs up a real user via the API, so the app needs a
    # writable Postgres. We spin up an ephemeral one per run — no pollution
    # in production, no shared state between runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopping_list_perf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_list_perf
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Verify script never creates an invitation, so these are never read —
      # but the better-auth plugin is registered at startup and tolerates
      # placeholder values just fine.
      RESEND_API_KEY: ci-dummy-not-used
      RESEND_FROM_EMAIL: noreply@example.com
      NODE_ENV: production
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Override NODE_ENV for install only — pnpm skips devDependencies
        # when NODE_ENV=production, and we need @playwright/test + the
        # playwright CLI binary to be installed.
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app
        run: pnpm build

      - name: Install psql and apply DB schema
        # The schema is applied directly with psql using db/init.sql (a
        # hand-derived mirror of src/db/schema/*), so the step needs no new
        # Node deps.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Start app and run audit
        id: run-audit
        # `pnpm start` and the audit must share a shell so the backgrounded
        # server isn't reaped when the step's command line returns. We poll
        # `/api/auth/get-session` to confirm the app is ready, run the audit,
        # then shut the server down.
        run: |
          pnpm start >/tmp/app.log 2>&1 &
          APP_PID=$!

          on_exit() {
            rc=$?
            kill $APP_PID 2>/dev/null || true
            if [ $rc -ne 0 ]; then
              echo "::group::App log on failure"
              tail -200 /tmp/app.log 2>/dev/null || echo "(no app log)"
              echo "::endgroup::"
            fi
          }
          trap on_exit EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/auth/get-session >/dev/null 2>&1; then
              echo "App ready after ${i}s"
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://localhost:3000/api/auth/get-session >/dev/null 2>&1; then
            echo "App did not start within 60s"
            tail -50 /tmp/app.log
            exit 1
          fi

          pnpm exec node scripts/verify-perf-07.mjs; exit $?
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report-*.json
          if-no-files-found: warn
          retention-days: 30
      # Only open a perf-regression issue when the audit step itself failed.

      # Setup/build errors surface as skipped or unrelated step failures
      # and are visible in the Actions run without polluting the issue inbox.
      # Without set -e, the script exits with the audit's own exit code
      # (explicit "exit $?" at the end), so GitHub records the correct
      # conclusion == 'failure' when the audit fails.
      - name: Open or update perf-regression issue
        if: ${{ always() && steps.run-audit.conclusion == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- perf-audit-bot -->';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'perf-regression',
              per_page: 1,
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              'PERF-07 audit failed. Latest run: ' + runUrl,
              '',
              'Download the `lighthouse-report` artifact from the run for the full JSON.',
              '',
              'If this is a workflow setup error (not a real perf regression), close the issue — the next scheduled run will re-verify.',
              '',
              'See `docs/perf-audit.md` for the failure-handling runbook.',
            ].join('\n');
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              core.info(`Commented on existing perf-regression issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'PERF-07 regression: Lighthouse audit failed',
                body,
                labels: ['perf-regression'],
              });
              core.info(`Opened perf-regression issue #${created.number}`);
            }
