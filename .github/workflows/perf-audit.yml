name: perf-audit

on:
  schedule:
    # 03:00 UTC on the 1st of every other month (Jan/Mar/May/Jul/Sep/Nov)
    - cron: '0 3 1 1/2 *'
  workflow_dispatch: # manual trigger for verification

permissions:
  contents: read
  issues: write    # needed to open / comment on the perf-regression issue

# Never cancel an in-flight audit; serialized runs only.
concurrency:
  group: perf-audit
  cancel-in-progress: false

jobs:
  perf-07:
    # Hard cap so a runaway job doesn't burn the whole Actions quota. The
    # local stack starts containers, so the budget is the integration job's.
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # The verify script signs up a real user and creates a household, so the
    # job needs both halves of the platform: a Supabase Auth server to sign
    # up against, and a Postgres to hold the household. The local stack
    # brings both — GoTrue owns the `auth` schema and writes the user into
    # the same database the application reads — so the run is hermetic: no
    # pollution in production, no shared state between runs, and no secrets.
    #
    # The stack's Postgres is the one the application connects to, which is
    # what makes the journey work: GoTrue's user row and the household's
    # foreign key are in the same database.
    env:
      # The local stack's own Postgres, as its owner. The owner bypasses RLS,
      # which is what this audit measured before the auth swap as well.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # The verify script never creates an invitation, so these are never
      # read — but the invitation mailer is configured at startup and
      # tolerates placeholder values just fine.
      RESEND_API_KEY: ci-dummy-not-used
      RESEND_FROM_EMAIL: noreply@example.com
      NODE_ENV: production
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The CLI version is pinned so the local stack does not change shape
      # under the job. It is the version the config in supabase/ was written
      # for.
      - uses: supabase/setup-cli@v1
        with:
          version: v3.1.0

      - name: Start the local stack
        # Postgres and GoTrue, and the API gateway the browser client talks
        # to. The rest of the platform is not involved in an audit.
        run: |
          supabase start \
            --exclude studio,edge-runtime,logflare,vector,imgproxy,storage-api,realtime,postgrest,postgres-meta,supavisor,mailpit

      - name: Read the stack's public configuration
        # The application's own two values, taken from the stack that is
        # running: the URL the browser client signs up against and the
        # publishable key it signs up with. Both are public by design.
        #
        # PUBLISHABLE_KEY, not ANON_KEY: the CLI prints both, and the
        # publishable key is the one the browser client is meant to use.
        #
        # The CLI's output is parsed, not evaluated. `eval` of the whole
        # file would fail late and vaguely - minutes later, after the stack
        # has started and the app has been built - and it would evaluate
        # whatever else the CLI prints. If the output's shape changes, the
        # job says so here, where the cause is.
        run: |
          supabase status --output env > /tmp/stack.env
          url=$(grep -E '^API_URL=' /tmp/stack.env | head -1 | cut -d= -f2- | tr -d '"')
          key=$(grep -E '^PUBLISHABLE_KEY=' /tmp/stack.env | head -1 | cut -d= -f2- | tr -d '"')
          for value in url key; do
            if [ -z "${!value}" ]; then
              echo "::error::the local stack's $value was not read from 'supabase status --output env'"
              exit 1
            fi
          done
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$key"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        # Override NODE_ENV for install only — pnpm skips devDependencies
        # when NODE_ENV=production, and we need @playwright/test + the
        # playwright CLI binary to be installed.
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply the schema
        # The migration folder is the source of truth for the schema; the
        # flat snapshot db/init.sql is a mirror of it. The runner records a
        # checksum of every migration it applies, so a second run is a
        # no-op.
        #
        # The snapshot is not applied as well: it adds its constraints
        # unconditionally, so applying both would fail on the first
        # constraint that already exists.
        run: pnpm db:migrate

      - name: Build app
        run: pnpm build

      - name: Start app and run audit
        id: run-audit
        # `pnpm start` and the audit must share a shell so the backgrounded
        # server isn't reaped when the step's command line returns. We poll
        # one of the application's own routes to confirm the app is ready,
        # run the audit, then shut the server down.
        run: |
          pnpm start >/tmp/app.log 2>&1 &
          APP_PID=$!

          on_exit() {
            rc=$?
            kill $APP_PID 2>/dev/null || true
            if [ $rc -ne 0 ]; then
              echo "::group::App log on failure"
              tail -200 /tmp/app.log 2>/dev/null || echo "(no app log)"
              echo "::endgroup::"
            fi
          }
          trap on_exit EXIT

          # The readiness probe answers "is the application up?". The route
          # it asks is one that needs a session, so 401 is the answer for a
          # running application — and 404 would mean the route is gone,
          # which is exactly what a probe for a deleted route must catch
          # rather than wait out the timeout for.
          ready() {
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/categories)
            [ "$code" = "401" ] || [ "$code" = "200" ]
          }

          for i in $(seq 1 60); do
            if ready; then
              echo "App ready after ${i}s"
              break
            fi
            sleep 1
          done

          if ! ready; then
            echo "App did not start within 60s"
            tail -50 /tmp/app.log
            exit 1
          fi

          pnpm exec node scripts/verify-perf-07.mjs; exit $?
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report-*.json
          if-no-files-found: warn
          retention-days: 30
      # Only open a perf-regression issue when the audit step itself failed.

      # Setup/build errors surface as skipped or unrelated step failures
      # and are visible in the Actions run without polluting the issue inbox.
      # Without set -e, the script exits with the audit's own exit code
      # (explicit "exit $?" at the end), so GitHub records the correct
      # conclusion == 'failure' when the audit fails.
      - name: Open or update perf-regression issue
        if: ${{ always() && steps.run-audit.conclusion == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- perf-audit-bot -->';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'perf-regression',
              per_page: 1,
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              'PERF-07 audit failed. Latest run: ' + runUrl,
              '',
              'Download the `lighthouse-report` artifact from the run for the full JSON.',
              '',
              'If this is a workflow setup error (not a real perf regression), close the issue — the next scheduled run will re-verify.',
              '',
              'See `docs/perf-audit.md` for the failure-handling runbook.',
            ].join('\n');
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              core.info(`Commented on existing perf-regression issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'PERF-07 regression: Lighthouse audit failed',
                body,
                labels: ['perf-regression'],
              });
              core.info(`Opened perf-regression issue #${created.number}`);
            }
