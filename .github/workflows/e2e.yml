name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref. A new push cancels the run it replaces - except on main.
#
# This job is a report and never a gate, and a report that is cancelled is
# not a report: with the rule below, every merge to main cancelled the run in
# flight and started another one, so on a busy main the job never finished at
# all - it never produced a duration, never reported a red journey, and never
# opened the issue that is its whole purpose. The suite step was measured
# running for 8m04s and then 10m32s before being killed.
#
# A pull request keeps the old behaviour: a new push cancels the run it
# replaces, because only the newest commit is worth testing.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  issues: write # needed to open / comment on the journey-failure issue

jobs:
  playwright:
    name: playwright, reporting only
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The job reports; it never refuses a merge.
    #
    # Two things make it non-gating, and both are needed. `continue-on-error`
    # keeps the workflow run green while the journey is broken, and the job
    # is not among the required checks — only "lint, type-check, unit tests,
    # build" is — so nothing waits for it either way.
    #
    # The signal is therefore not the check itself: it is the annotations the
    # Playwright reporter leaves on the pull request, the report artifact,
    # and the issue this job opens when the suite fails.
    #
    # It starts red. The application cannot create a household yet
    # (P0S-T16), and the suite is right about it; the job goes green when
    # P0S-T30 lands. Landing it now is what puts the broken journey on the
    # record instead of leaving it to be found by hand.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # NODE_ENV is overridden for the install only: pnpm skips
        # devDependencies when NODE_ENV=production, and the test runner
        # lives there.
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile

      # The browsers the suite needs: Chromium, Firefox and WebKit. The
      # iPhone 13 profile runs on WebKit. `--with-deps` installs the system
      # libraries they need — libgles2, libx264 and the rest — which the
      # runner does not have; without them WebKit does not launch at all.
      - name: Install the browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # The CLI version is pinned so the local stack does not change shape
      # under the job. It is the version the config in supabase/ was written
      # for.
      - uses: supabase/setup-cli@v1
        with:
          version: v3.1.0

      # The local stack: the database, and GoTrue, which owns the `auth`
      # schema every policy keys on.
      #
      # Kong is NOT excluded, unlike in the integration job: the Supabase
      # client the application uses addresses the gateway, and the gateway
      # is what serves `/auth/v1`. Without it the browser could sign nobody
      # in.
      - name: Start the local stack
        run: |
          supabase start \
            --exclude studio,edge-runtime,logflare,vector,imgproxy,storage-api,realtime,postgrest,postgres-meta,supavisor,mailpit

      # The stack's own configuration: the API URL the application points at
      # and the two keys. They are not secrets — the stack mints them for
      # containers that live for the length of one job, and nobody outside
      # the job can reach them.
      #
      # The keys are the ones the CLI prints as PUBLISHABLE_KEY and
      # SECRET_KEY. It also prints ANON_KEY and SERVICE_ROLE_KEY, but those
      # two are the placeholder "***" — the CLI prints the new names, and
      # only the new names carry the key.
      - name: Read the stack's configuration
        id: stack
        run: |
          supabase status --output env > /tmp/stack.env
          cat /tmp/stack.env
          url=$(grep -E '^API_URL=' /tmp/stack.env | head -1 | cut -d= -f2- | tr -d '"')
          anon=$(grep -E '^PUBLISHABLE_KEY=' /tmp/stack.env | head -1 | cut -d= -f2- | tr -d '"')
          service=$(grep -E '^SECRET_KEY=' /tmp/stack.env | head -1 | cut -d= -f2- | tr -d '"')
          for value in url anon service; do
            if [ -z "${!value}" ]; then
              echo "::error::the local stack's $value was not read from 'supabase status --output env'"
              exit 1
            fi
          done
          {
            echo "url=$url"
            echo "anon=$anon"
            echo "service=$service"
          } >> "$GITHUB_OUTPUT"

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply the migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm db:migrate

      - name: Give the app role its password
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/ci/app-role.sql

      # The suite runs against the application, and the application connects
      # as the non-owner role, so the policies apply to it — which is the
      # point: the household cannot be created, and the suite says so.
      #
      # The Supabase values come from the stack above. The transitional route
      # the specs sign in through needs the service-role key, because it
      # provisions and re-keys GoTrue accounts.
      #
      # The suite has to finish inside the job's budget, and a suite that
      # does not finish is a finding of its own: the specs that ran may all
      # have passed, and the ones that did not run are the point.
      #
      # **The budget is the `timeout` command and not the step's own.** A
      # step that runs out of time *fails*, and the job carries on to the
      # report and to the issue below. The job's own timeout cancels the
      # job instead, and a cancelled job runs no further step: the issue
      # step was skipped exactly that way when the job was killed by its
      # 45-minute timeout, and the journey-failure issue was never opened.
      - name: Run the browser suite
        id: suite
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # No Resend key: the invitation mail is skipped and the invitation
          # row is written. A placeholder key would make the mail fail, the
          # route throw, and the invitation never be written.
          RESEND_FROM_EMAIL: noreply@example.com
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # The suite's budget. The job has 45 minutes; the stack and the
          # browsers take two of them, and the report and the issue want
          # the rest.
          SUITE_TIMEOUT: 35m
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s "$SUITE_TIMEOUT" pnpm test:e2e
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::the browser suite exited with $code"
          exit $code

      # The distinction the issue has to make: a suite that failed and a
      # suite that did not finish are two different findings, and the second
      # one is invisible in the specs' own output — the specs that ran
      # passed. This step fails when the suite did not finish, and the
      # trusted reporter reads its conclusion.
      - name: Say whether the suite finished
        id: finished
        if: ${{ always() }}
        env:
          SUITE_EXIT_CODE: ${{ steps.suite.outputs.exit_code }}
        run: |
          if [ "$SUITE_EXIT_CODE" = "124" ] || [ "$SUITE_EXIT_CODE" = "137" ]; then
            echo "::error::The browser suite did not finish: it was stopped before the last test ran."
            exit 1
          fi

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      # A red run has to be noticed by a person, not just recorded: the same
      # shape of issue the perf-audit workflow opens when its audit fails.
      # The label is created if it is not there yet, so the job does not
      # depend on somebody having prepared the repository for it.
      #
      # A pull request from a fork, and a Dependabot pull request, are given
      # a read-only token however much this workflow asks for `issues: write`.
      # The step is allowed to fail there — the failure that matters is the
      # suite's — and the trusted reporter in
      # .github/workflows/e2e-report.yml opens the issue in that case.
      #
      # **A suite that did not finish is a failure too**, and the issue says
      # which of the two it was: the specs that ran may all have passed, and
      # the ones that did not run are the finding.
      - name: Open or update the journey-failure issue
        if: ${{ always() && (steps.suite.conclusion == 'failure' || steps.suite.conclusion == 'cancelled' || steps.finished.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- e2e-bot -->';
            const label = 'e2e-failure';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // The suite that did not finish is a different finding from the
            // suite that failed, and the issue has to say which one it is.
            const didNotFinish =
              '${{ steps.finished.outcome }}' === 'failure' ||
              '${{ steps.suite.conclusion }}' === 'cancelled';
            const headline = didNotFinish
              ? 'The browser suite did not finish: it was stopped before the last test ran.'
              : 'The browser suite failed.';
            const title = didNotFinish
              ? 'The browser suite did not finish in CI'
              : 'The browser suite failed in CI';

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'B60205',
                description: 'The browser suite failed in CI',
              });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              headline + ' Latest run: ' + runUrl,
              '',
              'Download the `playwright-report` artifact from the run for the traces and the screenshots.',
              '',
              'This job does not gate a merge. It is here so that a broken journey is noticed.',
              '',
              'See `docs/project.md` §12.1a and the e2e workflow for what the suite covers.',
            ].join('\n');

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issues[0].number,
                body,
              });
              core.info(`Commented on existing ${label} issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Opened ${label} issue #${created.number}`);
            }
