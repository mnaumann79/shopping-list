name: e2e report

# The trusted reporter for the browser suite.
#
# A pull request from a fork, and a Dependabot pull request, are given a
# read-only token however much the e2e workflow asks for `issues: write` — so
# on those runs the job cannot open the issue itself, and a failure nobody
# sees is exactly what this whole arrangement exists to avoid.
#
# This workflow is triggered by the *completed* e2e run, so it runs in the
# base repository's context, with a token that can write. It checks out
# nothing and executes no pull request's code: it reads the run's result and
# writes an issue, and that is all it does.
on:
  workflow_run:
    workflows: ["e2e"]
    types: [completed]

permissions:
  contents: read
  issues: write # needed to open / comment on the journey-failure issue

jobs:
  report:
    name: report a failed browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The issue's shape is the perf-audit workflow's: one labelled issue,
      # commented on rather than duplicated, opened on the first failure.
      # Keep it in step with .github/workflows/e2e.yml, which opens the same
      # issue when it has the token to do it.
      - name: Open or update the journey-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- e2e-bot -->';
            const label = 'e2e-failure';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;

            // The e2e workflow's own conclusion is "success" even when its
            // job failed, because the job carries continue-on-error: it must
            // not gate a merge. The job's conclusion is the one that says
            // whether the suite failed.
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
            });
            const failed = jobs.jobs.find((job) => job.conclusion === 'failure');
            if (!failed) {
              core.info('no job failed; nothing to report');
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'B60205',
                description: 'The browser suite failed in CI',
              });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });
            const body = [
              marker,
              'The browser suite failed. Latest run: ' + runUrl,
              '',
              'Download the `playwright-report` artifact from the run for the traces and the screenshots.',
              '',
              'This job does not gate a merge. It is here so that a broken journey is noticed.',
              '',
              'See `docs/project.md` §12.1a and the e2e workflow for what the suite covers.',
            ].join('\n');

            if (issues.length === 0) {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title: 'The browser suite failed in CI',
                body,
                labels: [label],
              });
              core.info(`Opened ${label} issue #${created.number}`);
              return;
            }

            // The e2e job opens the issue itself when it has the token to do
            // it. If this run is already in the issue, the job has reported
            // it, and saying it twice is noise.
            const issue = issues[0];
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issue.number,
            });
            const alreadyReported =
              issue.body?.includes(runUrl) ||
              comments.some((comment) => comment.body?.includes(runUrl));

            if (alreadyReported) {
              core.info(`run ${run.id} is already in issue #${issue.number}`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });
            core.info(`Commented on existing ${label} issue #${issue.number}`);
